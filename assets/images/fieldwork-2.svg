<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="40%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="mudflat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="360" fill="url(#sky2)"/>
  
  <!-- Sun / Horizon glow -->
  <circle cx="300" cy="190" r="45" fill="#fef08a" opacity="0.45"/>

  <!-- Water Surface -->
  <rect y="190" width="600" height="170" fill="url(#waterGrad)"/>
  <ellipse cx="300" cy="210" rx="180" ry="8" fill="#99f6e4" opacity="0.4"/>
  <ellipse cx="260" cy="240" rx="220" ry="12" fill="#5eead4" opacity="0.25"/>

  <!-- Mudflats & Saltmarsh Reeds -->
  <path d="M0,270 Q140,230 280,270 T600,260 L600,360 L0,360 Z" fill="url(#mudflat)"/>
  
  <!-- Mangrove & Reed Silhouettes -->
  <g fill="#134e4a">
    <path d="M40,280 Q45,210 60,180 Q65,220 70,280 Z"/>
    <path d="M65,280 Q75,190 90,170 Q95,215 100,280 Z"/>
    <path d="M95,285 Q115,200 120,185 Q125,230 130,285 Z"/>
    <path d="M480,270 Q500,180 520,160 Q525,210 530,270 Z"/>
    <path d="M515,275 Q535,170 545,150 Q555,205 565,275 Z"/>
    <path d="M550,280 Q565,200 580,180 Q585,220 590,280 Z"/>
  </g>

  <!-- Research Zodiac Boat / Pontoon with Sampling Rig -->
  <g transform="translate(180, 210)">
    <!-- Hull -->
    <path d="M10,40 L160,40 Q180,40 190,30 L170,18 Q160,18 10,18 Z" fill="#e2e8f0"/>
    <rect x="25" y="10" width="125" height="10" fill="#3b82f6"/>
    <!-- Core Drill Tripod -->
    <line x1="80" y1="20" x2="105" y2="-20" stroke="#f8fafc" stroke-width="2.5"/>
    <line x1="130" y1="20" x2="105" y2="-20" stroke="#f8fafc" stroke-width="2.5"/>
    <line x1="105" y1="-20" x2="105" y2="45" stroke="#f59e0b" stroke-width="3"/> <!-- Core tube -->
    <!-- Scientists on board -->
    <circle cx="65" cy="8" r="5" fill="#f8fafc"/>
    <rect x="60" y="13" width="10" height="15" fill="#ef4444"/> <!-- Life vest -->
    <circle cx="140" cy="8" r="5" fill="#f8fafc"/>
    <rect x="135" y="13" width="10" height="15" fill="#ef4444"/>
  </g>

  <!-- Tag Pill -->
  <rect x="25" y="25" width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="42" cy="39" r="4" fill="#06b6d4"/>
  <text x="56" y="44" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">
    Coastal Wetland Coring
  </text>
</svg>
