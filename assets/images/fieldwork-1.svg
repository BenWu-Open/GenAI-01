<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="360" fill="url(#sky1)"/>
  
  <!-- Distant Stars / Research Grid -->
  <circle cx="120" cy="50" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="65" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="530" cy="30" r="1.5" fill="#fff" opacity="0.7"/>
  
  <!-- Distant Range -->
  <polygon points="50,220 180,110 270,190 390,90 520,210 600,160 600,360 0,360 0,230" fill="url(#mtn2)" opacity="0.85"/>
  <polygon points="180,110 210,150 160,150" fill="#f8fafc" opacity="0.8"/>
  <polygon points="390,90 425,135 365,135" fill="#f8fafc" opacity="0.9"/>

  <!-- Midground Mountain -->
  <polygon points="-50,360 80,180 230,360" fill="url(#mtn1)"/>
  <polygon points="80,180 115,220 60,220" fill="#ffffff"/>
  
  <!-- Forest Hills -->
  <path d="M150,360 C220,230 380,220 600,270 L600,360 Z" fill="#064e3b" opacity="0.95"/>
  <path d="M0,360 C120,260 250,270 420,360 Z" fill="#047857"/>

  <!-- Weather & Data Tower -->
  <g transform="translate(480, 160)">
    <!-- Mast -->
    <line x1="20" y1="120" x2="20" y2="10" stroke="#f1f5f9" stroke-width="2.5"/>
    <line x1="10" y1="120" x2="20" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="120" x2="20" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Anemometer -->
    <line x1="10" y1="15" x2="30" y2="15" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="10" cy="15" r="3" fill="#38bdf8"/>
    <circle cx="30" cy="15" r="3" fill="#38bdf8"/>
    <circle cx="20" cy="10" r="2.5" fill="#ef4444"/>
    <!-- Solar panel -->
    <rect x="5" y="50" width="30" height="15" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 20 57)"/>
  </g>

  <!-- Survey Tent / Basecamp -->
  <polygon points="260,290 310,240 360,290" fill="#f97316"/>
  <polygon points="310,240 330,290 310,290" fill="#ea580c"/>
  <polygon points="260,290 280,290 310,240" fill="#c2410c"/>

  <!-- Field Researcher Silhouette with GPS Pole -->
  <g transform="translate(190, 250)">
    <!-- GPS Staff -->
    <line x1="42" y1="50" x2="42" y2="0" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="42" cy="0" rx="4" ry="2.5" fill="#eab308"/>
    <!-- Researcher -->
    <circle cx="25" cy="15" r="5" fill="#f8fafc"/>
    <path d="M20,20 L30,20 L33,38 L27,38 L25,32 L23,38 L17,38 Z" fill="#3b82f6"/>
    <!-- Backpack -->
    <rect x="15" y="21" width="5" height="10" rx="2" fill="#d97706"/>
  </g>

  <!-- Tag Pill -->
  <rect x="25" y="25" width="170" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="42" cy="39" r="4" fill="#10b981"/>
  <text x="56" y="44" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">
    Alpine Ecosystem Study
  </text>
</svg>
