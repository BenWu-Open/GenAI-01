<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="45%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="desertDune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="360" fill="url(#sky3)"/>
  
  <!-- Sun -->
  <circle cx="480" cy="90" r="35" fill="#fef08a" opacity="0.9"/>
  <circle cx="480" cy="90" r="55" fill="#fed7aa" opacity="0.3"/>

  <!-- Plateau / Mesa Formations -->
  <polygon points="40,240 80,180 200,180 230,240" fill="#9a3412"/>
  <polygon points="180,240 220,150 360,150 400,240" fill="#b45309"/>

  <!-- Sand Dunes -->
  <path d="M0,270 Q160,200 320,280 T600,250 L600,360 L0,360 Z" fill="url(#desertDune)"/>
  <path d="M0,320 Q220,260 440,330 T600,310 L600,360 L0,360 Z" fill="#92400e" opacity="0.9"/>

  <!-- Quadcopter Research Drone with LiDAR sensor -->
  <g transform="translate(180, 80)">
    <!-- Drone Body -->
    <ellipse cx="60" cy="30" rx="20" ry="8" fill="#1e293b"/>
    <!-- Arms -->
    <line x1="20" y1="18" x2="100" y2="42" stroke="#475569" stroke-width="3"/>
    <line x1="20" y1="42" x2="100" y2="18" stroke="#475569" stroke-width="3"/>
    <!-- Rotors & spin blur -->
    <ellipse cx="20" cy="18" rx="18" ry="4" fill="#94a3b8" opacity="0.6"/>
    <ellipse cx="100" cy="42" rx="18" ry="4" fill="#94a3b8" opacity="0.6"/>
    <ellipse cx="20" cy="42" rx="18" ry="4" fill="#94a3b8" opacity="0.6"/>
    <ellipse cx="100" cy="18" rx="18" ry="4" fill="#94a3b8" opacity="0.6"/>
    <!-- LiDAR Pod (green pulse downwards) -->
    <rect x="54" y="36" width="12" height="10" rx="2" fill="#0284c7"/>
    <polygon points="60,46 10,230 110,230" fill="#10b981" opacity="0.18"/>
    <line x1="60" y1="46" x2="10" y2="230" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="60" y1="46" x2="110" y2="230" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Ground Control Station / Rugged Vehicle -->
  <g transform="translate(390, 275)">
    <!-- 4x4 Field Truck Silhouette -->
    <path d="M10,40 L30,40 L35,28 L75,28 L95,40 L120,40 L125,55 L0,55 Z" fill="#1e293b"/>
    <!-- Wheels -->
    <circle cx="30" cy="55" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="100" cy="55" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- Roof Antenna -->
    <line x1="45" y1="28" x2="45" y2="12" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="45" cy="10" r="3" fill="#f59e0b"/>
  </g>

  <!-- Tag Pill -->
  <rect x="25" y="25" width="190" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="42" cy="39" r="4" fill="#f59e0b"/>
  <text x="56" y="44" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600">
    Arid Basin LiDAR Mapping
  </text>
</svg>
