<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Stylized Researcher Silhouette -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="200" cy="140" r="58" fill="#e2e8f0"/>
    
    <!-- Glasses / Modern Scholar Accent -->
    <rect x="165" y="130" width="28" height="18" rx="5" fill="#334155" />
    <rect x="207" y="130" width="28" height="18" rx="5" fill="#334155" />
    <line x1="193" y1="138" x2="207" y2="138" stroke="#334155" stroke-width="3" />
    
    <!-- Torso / Shoulders -->
    <path d="M105,310 C105,245 145,215 200,215 C255,215 295,245 295,310 Z" fill="#cbd5e1"/>
    
    <!-- Field Jacket / Collar Accent -->
    <path d="M160,215 L200,270 L240,215" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M200,270 L200,310" stroke="#2563eb" stroke-width="4"/>
  </g>

  <!-- Compass / Field Badge -->
  <g transform="translate(290, 270)">
    <circle cx="25" cy="25" r="28" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <!-- Compass needle -->
    <polygon points="25,9 31,25 25,22 19,25" fill="#f87171"/>
    <polygon points="25,41 31,25 25,22 19,25" fill="#f1f5f9"/>
    <circle cx="25" cy="25" r="3" fill="#ffffff"/>
  </g>

  <!-- Replace Hint text -->
  <rect x="75" y="335" width="250" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="200" y="354" fill="#93c5fd" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" font-weight="600">
    Replace with your photo (avatar.jpg)
  </text>
</svg>
